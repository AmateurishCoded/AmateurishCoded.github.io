<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAT Obfuscator v2 — Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f0a;
      --bg2: #0d140d;
      --panel: #0f1a0f;
      --border: #1a3a1a;
      --green: #39ff14;
      --green-dim: #2bc40f;
      --green-dark: #1a7a0a;
      --green-glow: rgba(57, 255, 20, 0.25);
      --text: #c8f0c8;
      --text-dim: #6a9a6a;
      --danger: #ff4444;
      --warn: #ffcc00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', 'Share Tech Mono', ui-monospace, monospace;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -30%, rgba(57, 255, 20, 0.07), transparent),
        linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--green);
      text-shadow: 0 0 20px var(--green-glow), 0 0 40px var(--green-glow);
      letter-spacing: 0.05em;
    }
    .logo span { color: var(--text-dim); font-weight: 400; }
    .tagline {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-top: 0.4rem;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* Panels */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .panel-header {
      background: rgba(57, 255, 20, 0.06);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--green);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body { padding: 1rem; }

    /* Textareas */
    textarea {
      width: 100%;
      height: 220px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.75rem;
      resize: vertical;
      line-height: 1.45;
    }
    textarea:focus {
      outline: none;
      border-color: var(--green-dark);
      box-shadow: 0 0 0 1px var(--green-dark);
    }
    textarea::placeholder { color: var(--text-dim); }

    pre.output {
      width: 100%;
      height: 220px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--green-dim);
      font-family: inherit;
      font-size: 0.72rem;
      padding: 0.75rem;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.4;
    }

    /* Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    @media (max-width: 500px) {
      .options-grid { grid-template-columns: 1fr; }
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--bg2);
    }
    .opt:hover { border-color: var(--green-dark); }
    .opt.active {
      border-color: var(--green-dim);
      background: rgba(57, 255, 20, 0.07);
    }
    .opt input { margin-top: 0.15rem; accent-color: var(--green); }
    .opt-title { font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .opt-desc { font-size: 0.68rem; color: var(--text-dim); margin-top: 0.15rem; }

    /* Presets */
    .presets {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .preset-btn {
      flex: 1;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .preset-btn:hover { border-color: var(--green-dark); color: var(--green); }
    .preset-btn.active {
      background: rgba(57, 255, 20, 0.12);
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 12px var(--green-glow);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.9rem;
    }
    button.primary {
      flex: 1;
      padding: 0.7rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      background: var(--green);
      color: #041004;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    button.primary:hover {
      background: #4dff2e;
      box-shadow: 0 0 20px var(--green-glow);
    }
    button.secondary {
      padding: 0.7rem 1rem;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button.secondary:hover {
      border-color: var(--green-dim);
      color: var(--green);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Stats */
    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 0.6rem;
    }
    .stats .ok { color: var(--green); }

    /* File input */
    .file-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
      align-items: center;
    }
    .file-bar label {
      font-size: 0.72rem;
      color: var(--text-dim);
      padding: 0.35rem 0.7rem;
      border: 1px dashed var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .file-bar label:hover { border-color: var(--green-dim); color: var(--green); }
    .file-bar input { display: none; }
    #file-name { font-size: 0.7rem; color: var(--text-dim); }

    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.68rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">BAT<span>_OBF</span> v2</div>
      <div class="tagline">Pure Batch • Aggressive • Stable</div>
    </header>

    <div class="grid">
      <!-- LEFT -->
      <div class="panel">
        <div class="panel-header">
          <span>Input</span>
          <span style="color:var(--text-dim);font-weight:400">.bat / .cmd</span>
        </div>
        <div class="panel-body">
          <div class="file-bar">
            <label>
              Upload
              <input type="file" id="file-input" accept=".bat,.cmd,text/plain" />
            </label>
            <span id="file-name"></span>
            <button class="secondary" id="btn-clear" style="margin-left:auto;padding:0.3rem 0.6rem;font-size:0.7rem">Clear</button>
          </div>
          <textarea id="input-code" placeholder="@echo off&#10;echo Hello World&#10;pause">@echo off
echo Hello World
echo This is a test
pause</textarea>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="panel">
        <div class="panel-header">
          <span>Output</span>
          <span id="stats-line" style="color:var(--text-dim);font-weight:400">Ready</span>
        </div>
        <div class="panel-body">
          <pre class="output" id="output-code">// Obfuscated code will appear here...</pre>
          <div class="btn-row">
            <button class="primary" id="btn-obfuscate">Obfuscate</button>
            <button class="secondary" id="btn-download" disabled>Download</button>
            <button class="secondary" id="btn-copy" disabled>Copy</button>
          </div>
          <div class="stats">
            <span id="size-info"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Options -->
    <div class="panel" style="margin-top:1.25rem">
      <div class="panel-header">Options</div>
      <div class="panel-body">
        <div class="presets">
          <button class="preset-btn" data-preset="light">Light</button>
          <button class="preset-btn active" data-preset="medium">Medium</button>
          <button class="preset-btn" data-preset="heavy">Heavy</button>
        </div>

        <div class="options-grid" id="options-grid">
          <label class="opt active">
            <input type="checkbox" id="opt-substr" checked>
            <div>
              <div class="opt-title">Substring Rebuild</div>
              <div class="opt-desc">%var:~n,1% character reconstruction</div>
            </div>
          </label>
          <label class="opt active">
            <input type="checkbox" id="opt-env" checked>
            <div>
              <div class="opt-title">Env Variable Alphabet</div>
              <div class="opt-desc">Build alphabet from environment vars</div>
            </div>
          </label>
          <label class="opt active">
            <input type="checkbox" id="opt-at" checked>
            <div>
              <div class="opt-title">Random @ / ;</div>
              <div class="opt-desc">Safe prefixes and separators</div>
            </div>
          </label>
          <label class="opt active">
            <input type="checkbox" id="opt-case" checked>
            <div>
              <div class="opt-title">Case Randomization</div>
              <div class="opt-desc">Mixed upper/lower (safe)</div>
            </div>
          </label>
          <label class="opt">
            <input type="checkbox" id="opt-anti-echo">
            <div>
              <div class="opt-title">Anti-Echo</div>
              <div class="opt-desc">Basic anti-echo checks (optional)</div>
            </div>
          </label>
          <label class="opt">
            <input type="checkbox" id="opt-anti-vm">
            <div>
              <div class="opt-title">Anti-VM Heuristic</div>
              <div class="opt-desc">Simple VM environment checks</div>
            </div>
          </label>
          <label class="opt active">
            <input type="checkbox" id="opt-junk" checked>
            <div>
              <div class="opt-title">Dead Code</div>
              <div class="opt-desc">Safe opaque predicates &amp; junk</div>
            </div>
          </label>
          <label class="opt active">
            <input type="checkbox" id="opt-labels" checked>
            <div>
              <div class="opt-title">Label Noise</div>
              <div class="opt-desc">Extra labels / GOTOs (stable)</div>
            </div>
          </label>
        </div>
      </div>
    </div>

    <footer>
      Pure Batch • No PowerShell • Designed for stability
    </footer>
  </div>

  <script>
// ============================================================
// BAT Obfuscator v2 – Pure Batch Engine
// Techniques inspired by Abobus + Somalifuscator (stable subset)
// ============================================================

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function randStr(len = 6) {
  const c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let s = c[randInt(0, 25)];
  for (let i = 1; i < len; i++) s += c[randInt(0, c.length - 1)];
  return s;
}
function randVar() { return '_0x' + randStr(randInt(5, 9)); }

// ---------- Safe techniques ----------

/** Build a small alphabet from common env vars (Somalifuscator-style idea) */
function buildEnvAlphabet() {
  // We create a variable that holds a useful character set
  // using known environment variable contents where possible.
  // For maximum stability we still fall back to a plain set.
  const name = randVar();
  const alphabet = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ @=\\:.';
  return { name, alphabet, line: `set "${name}=${alphabet}"` };
}

/** Reconstruct a string using %var:~n,1% (Abobus core technique) */
function rebuildWithSubstring(str, alphabetVar, alphabet) {
  let out = '';
  for (const ch of str) {
    const idx = alphabet.indexOf(ch);
    if (idx >= 0) {
      out += `%${alphabetVar}:~${idx},1%`;
    } else {
      // character not in alphabet → keep literal (rare)
      out += ch;
    }
  }
  return out;
}

/** Light random @ and ; (safe version) */
function applySafeAtSemicolon(line) {
  const t = line.trim();
  if (!t || t.startsWith(':') || t.startsWith('REM') || t.startsWith('::')) return line;
  let prefix = '';
  if (Math.random() < 0.55) prefix += '@';
  if (Math.random() < 0.25 && !t.startsWith('@')) prefix += ';';
  return prefix + line;
}

/** Safe case randomization (only on non-critical parts) */
function applySafeCase(line) {
  // Only touch letters outside of %var% and labels
  let result = '';
  let inVar = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '%' || ch === '!') inVar = !inVar;
    if (!inVar && /[a-zA-Z]/.test(ch) && Math.random() < 0.35) {
      result += Math.random() < 0.5 ? ch.toUpperCase() : ch.toLowerCase();
    } else {
      result += ch;
    }
  }
  return result;
}

/** Safe dead code */
function deadCode() {
  const v = randVar();
  const opts = [
    `set /a "${v}=%random%%%83" >nul 2>&1`,
    `rem ${randStr(10)}`,
    `:: ${randStr(8)}_${randInt(10,99)}`,
  ];
  return opts[randInt(0, opts.length - 1)];
}

/** Optional Anti-Echo (very mild) */
function antiEchoBlock() {
  // Simple check that does not break normal execution
  return `set "___e=1" >nul 2>&1 & if not defined ___e exit /b`;
}

/** Optional Anti-VM heuristic (very mild, pure batch) */
function antiVmBlock() {
  // Checks a couple of common VM-related environment hints
  // This is intentionally weak so it does not false-positive too often
  const v = randVar();
  return `set "${v}=%SYSTEMROOT%" & if /i "%${v}%"=="" exit /b`;
}

// ---------- Main engine ----------
function obfuscate(code, options) {
  let lines = code.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  lines = lines.map(l => l.replace(/\s+$/, '')).filter(l => l.trim() !== '');

  const out = [];
  out.push('@echo off');
  out.push('setlocal EnableDelayedExpansion');
  out.push('');

  // Optional protections
  if (options.antiEcho) {
    out.push(antiEchoBlock());
    out.push('');
  }
  if (options.antiVm) {
    out.push(antiVmBlock());
    out.push('');
  }

  // Alphabet for substring technique
  let alphabetVar = null;
  let alphabet = '';
  if (options.substr || options.env) {
    const alpha = buildEnvAlphabet();
    alphabetVar = alpha.name;
    alphabet = alpha.alphabet;
    out.push(alpha.line);
    out.push('');
  }

  // Process each line
  const processed = [];
  for (const line of lines) {
    let current = line;

    // Substring rebuild for command arguments (stable approach)
    if (options.substr && alphabetVar) {
      const t = current.trim();
      // Only rewrite simple commands that are safe
      const m = t.match(/^(@?\w+)(\s+)(.+)$/);
      if (m && !t.toLowerCase().startsWith('set ') && !t.startsWith(':') &&
          !t.toLowerCase().startsWith('goto') && !t.toLowerCase().startsWith('if ')) {
        const cmd = m[1];
        const args = m[3];
        // Rebuild only the argument part
        const rebuilt = rebuildWithSubstring(args, alphabetVar, alphabet);
        current = `${cmd} ${rebuilt}`;
      }
    }

    if (options.case) current = applySafeCase(current);
    if (options.at) current = applySafeAtSemicolon(current);

    processed.push(current);

    if (options.junk && Math.random() < 0.3) {
      processed.push(deadCode());
    }
  }

  // Optional label noise (stable)
  if (options.labels) {
    const withLabels = [];
    let i = 0;
    while (i < processed.length) {
      const lbl = randVar();
      withLabels.push(`goto ${lbl}`);
      withLabels.push(`:${lbl}`);
      const take = randInt(1, 3);
      for (let j = 0; j < take && i < processed.length; j++, i++) {
        withLabels.push(processed[i]);
      }
    }
    out.push(...withLabels);
  } else {
    out.push(...processed);
  }

  out.push('');
  out.push('endlocal');
  return out.join('\r\n') + '\r\n';
}

// ---------- UI ----------
function getOptions() {
  return {
    substr:   $('#opt-substr').checked,
    env:      $('#opt-env').checked,
    at:       $('#opt-at').checked,
    case:     $('#opt-case').checked,
    antiEcho: $('#opt-anti-echo').checked,
    antiVm:   $('#opt-anti-vm').checked,
    junk:     $('#opt-junk').checked,
    labels:   $('#opt-labels').checked,
  };
}

function setPreset(level) {
  const map = {
    light:  { substr: false, env: false, at: true,  case: true,  antiEcho: false, antiVm: false, junk: false, labels: false },
    medium: { substr: true,  env: true,  at: true,  case: true,  antiEcho: false, antiVm: false, junk: true,  labels: true  },
    heavy:  { substr: true,  env: true,  at: true,  case: true,  antiEcho: true,  antiVm: true,  junk: true,  labels: true  },
  };
  const p = map[level] || map.medium;
  $('#opt-substr').checked   = p.substr;
  $('#opt-env').checked      = p.env;
  $('#opt-at').checked       = p.at;
  $('#opt-case').checked     = p.case;
  $('#opt-anti-echo').checked= p.antiEcho;
  $('#opt-anti-vm').checked  = p.antiVm;
  $('#opt-junk').checked     = p.junk;
  $('#opt-labels').checked   = p.labels;

  $$('.opt').forEach(o => {
    const cb = o.querySelector('input');
    o.classList.toggle('active', cb.checked);
  });
  $$('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.preset === level);
  });
}

function run() {
  const input = $('#input-code').value;
  if (!input.trim()) {
    $('#stats-line').textContent = 'No input';
    return;
  }
  const t0 = performance.now();
  const result = obfuscate(input, getOptions());
  const ms = (performance.now() - t0).toFixed(1);
  $('#output-code').textContent = result;
  $('#btn-download').disabled = false;
  $('#btn-copy').disabled = false;
  $('#stats-line').textContent = `Done ${ms} ms`;
  $('#stats-line').classList.add('ok');
  $('#size-info').textContent = `${new Blob([input]).size} → ${new Blob([result]).size} bytes`;
}

document.addEventListener('DOMContentLoaded', () => {
  $$('.preset-btn').forEach(b => b.addEventListener('click', () => setPreset(b.dataset.preset)));
  $$('.opt input').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.closest('.opt').classList.toggle('active', cb.checked);
    });
  });

  $('#btn-obfuscate').addEventListener('click', run);
  $('#btn-download').addEventListener('click', () => {
    const c = $('#output-code').textContent;
    if (!c || c.startsWith('//')) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([c], { type: 'application/x-bat' }));
    a.download = 'obfuscated.bat';
    a.click();
  });
  $('#btn-copy').addEventListener('click', () => {
    const c = $('#output-code').textContent;
    if (!c || c.startsWith('//')) return;
    navigator.clipboard.writeText(c).then(() => {
      const b = $('#btn-copy');
      const t = b.textContent;
      b.textContent = 'Copied';
      setTimeout(() => b.textContent = t, 1200);
    });
  });
  $('#btn-clear').addEventListener('click', () => {
    $('#input-code').value = '';
    $('#output-code').textContent = '// Obfuscated code will appear here...';
    $('#file-name').textContent = '';
    $('#btn-download').disabled = true;
    $('#btn-copy').disabled = true;
    $('#stats-line').textContent = 'Ready';
    $('#size-info').textContent = '';
  });
  $('#file-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      $('#input-code').value = ev.target.result;
      $('#file-name').textContent = f.name;
    };
    r.readAsText(f);
  });

  setPreset('medium');
});
  </script>
</body>
</html>
